name: CI

on:
  pull_request:
    branches: [main, staging, beta, integration]
  push:
    branches: ["feature/**", "fix/**", "hotfix/**"]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsc --noEmit
