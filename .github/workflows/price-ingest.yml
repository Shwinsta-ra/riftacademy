name: Daily price ingest

# tcgcsv rebuilds once a day at ~20:00 UTC and keeps ONLY the current build - there is
# no backfill endpoint. A day that is not fetched is gone permanently (2026-08-07 was
# lost exactly this way). 21:00 UTC leaves an hour of headroom after their build.
#
# NOTE: `schedule` only fires from the repository's DEFAULT branch. This workflow does
# nothing on a schedule until it has been promoted all the way to `main`; until then
# only `workflow_dispatch` can run it, and that also requires the file to be on main.
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ingest even if this tcgcsv build was already ingested'
        type: boolean
        default: false

# Never let two ingests overlap. They are idempotent, but a second run starting while
# the first is mid-apply would read a stale high-water mark and duplicate the work.
concurrency:
  group: price-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read last successful ingest from the database
        id: state
        env:
          RA_DB: ${{ secrets.RA_DB }}
        run: |
          if [ -z "$RA_DB" ]; then
            echo "::error::Secret RA_DB is not set. Add the Supabase session-pooler connection string (port 5432, not the IPv6-only direct host)."
            exit 1
          fi
          # Only status='ok' advances the mark. A 'running' row (crashed run) or a
          # 'skipped' one must never make the next day look already-ingested.
          last=$(psql "$RA_DB" -tAX -v ON_ERROR_STOP=1 \
            -c "select coalesce(max(source_built_at)::text,'') from price_ingest_runs where source_id='tcgplayer' and status='ok'")
          echo "last_built_at=$last" >> "$GITHUB_OUTPUT"
          echo "Last successful ingest: ${last:-never}"

      # Opened BEFORE the fetch, per supabase/README.md: "one row per execution,
      # written at start and completed at finish, so a crashed run is visibly
      # incomplete rather than invisible." If this job dies during the fetch, this row
      # survives as status='running' with a null finished_at.
      - name: Open the run row
        id: openrun
        env:
          RA_DB: ${{ secrets.RA_DB }}
          CI_RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          run_id=$(psql "$RA_DB" -tAX -v ON_ERROR_STOP=1 \
            -v ci="$CI_RUN_ID" -v sha="$COMMIT_SHA" \
            -c "insert into price_ingest_runs (source_id,status,ci_run_id,commit_sha)
                values ('tcgplayer','running',:'ci',:'sha') returning run_id")
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Opened price_ingest_runs row $run_id"

      - name: Fetch tcgcsv and generate SQL
        id: generate
        # LAST_BUILT_AT goes through the environment rather than being interpolated
        # into the run block. It is only ever a timestamp we wrote ourselves, but a
        # ${{ }} expansion inside a shell line is the standard Actions script-injection
        # shape and is not worth keeping just to save a variable.
        env:
          LAST_BUILT_AT: ${{ steps.state.outputs.last_built_at }}
          FORCE: ${{ inputs.force }}
          CI_RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ROW_ID: ${{ steps.openrun.outputs.run_id }}
        run: |
          args=(--last-built-at "$LAST_BUILT_AT" --run-id "$RUN_ROW_ID"
                --ci-run-id "$CI_RUN_ID" --commit-sha "$COMMIT_SHA")
          [ "$FORCE" = "true" ] && args+=(--force)
          python3 scripts/ingest_tcgcsv.py "${args[@]}"
          # The script writes price_ingest_<date>.sql only when there is something to
          # ingest, so the file's absence IS the "skipped, already current" signal.
          file=$(ls -1 price_ingest_*.sql 2>/dev/null | head -1 || true)
          if [ -n "$file" ]; then
            echo "sql_file=$file" >> "$GITHUB_OUTPUT"
            echo "observed_on=$(echo "$file" | sed -E 's/price_ingest_(.*)\.sql/\1/')" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to ingest - tcgcsv has not rebuilt since the last successful run."
          fi

      - name: Apply SQL
        if: steps.generate.outputs.sql_file != ''
        env:
          RA_DB: ${{ secrets.RA_DB }}
          SQL_FILE: ${{ steps.generate.outputs.sql_file }}
        run: |
          # ON_ERROR_STOP is load-bearing: without it psql reports success even when
          # every statement inside the begin/commit block aborted and the commit
          # silently degraded to a rollback.
          psql "$RA_DB" -v ON_ERROR_STOP=1 -f "$SQL_FILE"

      # Uploaded on every run that produced a file, not only failures. Nobody reads
      # these daily; they exist because this pipeline has already shipped several
      # silent defects, and "what exactly did we write that day" is otherwise
      # unanswerable after the fact.
      - name: Upload generated SQL as an audit artifact
        if: always() && steps.generate.outputs.sql_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: price-ingest-sql-${{ steps.generate.outputs.observed_on }}
          path: ${{ steps.generate.outputs.sql_file }}
          retention-days: 90

      - name: Verify the observations actually landed
        id: verify
        if: steps.generate.outputs.sql_file != ''
        env:
          RA_DB: ${{ secrets.RA_DB }}
          OBSERVED_ON: ${{ steps.generate.outputs.observed_on }}
        run: |
          rows=$(psql "$RA_DB" -tAX -v ON_ERROR_STOP=1 \
            -c "select count(*) from price_observations where observed_on = date '$OBSERVED_ON'")
          echo "rows=$rows" >> "$GITHUB_OUTPUT"
          echo "Rows for $OBSERVED_ON: $rows"
          echo "- **$OBSERVED_ON**: $rows price observations" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rows" -eq 0 ]; then
            echo "::error::psql reported success but no observations exist for $OBSERVED_ON."
            exit 1
          fi

      # 500 MB is the Supabase free-tier ceiling. Alerting at 350 MB leaves room to act
      # before writes start failing rather than after.
      # The 'ok' close is written by the generated SQL, inside the same transaction as
      # the observations - so the row can never say 'ok' unless the data actually
      # landed. The other two outcomes have no generated SQL, so they are closed here.
      - name: Close the run row for skip or failure
        if: always() && steps.openrun.outcome == 'success'
        env:
          RA_DB: ${{ secrets.RA_DB }}
          RUN_ROW_ID: ${{ steps.openrun.outputs.run_id }}
          SQL_FILE: ${{ steps.generate.outputs.sql_file }}
          JOB_STATUS: ${{ job.status }}
          LAST_BUILT_AT: ${{ steps.state.outputs.last_built_at }}
        run: |
          if [ "$JOB_STATUS" = "success" ] && [ -n "$SQL_FILE" ]; then
            echo "Ingest succeeded; the generated SQL already closed run $RUN_ROW_ID."
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            # Skip: guarded on 'running' so it can never overwrite a row the generated
            # SQL already closed as 'ok'.
            psql "$RA_DB" -tAX -v ON_ERROR_STOP=1 -v id="$RUN_ROW_ID" \
              -v note="no new tcgcsv build since ${LAST_BUILT_AT:-never}" \
              -c "update price_ingest_runs set status='skipped', finished_at=now(), notes=:'note'
                  where run_id=:'id'::bigint and status='running'"
            echo "Closed run $RUN_ROW_ID as skipped"
          else
            # Failure: deliberately NOT guarded. The two ways to be wrong here are not
            # symmetric. Marking a run failed when its data actually landed costs one
            # redundant re-ingest tomorrow, and re-ingest is idempotent. Leaving it
            # 'ok' when the data did NOT land advances the high-water mark, so the next
            # run skips and that day is lost permanently - which is the exact failure
            # this whole workflow exists to prevent. Bias to the recoverable error.
            psql "$RA_DB" -tAX -v ON_ERROR_STOP=1 -v id="$RUN_ROW_ID" \
              -v note="job status $JOB_STATUS" \
              -c "update price_ingest_runs set status='failed', finished_at=now(), notes=:'note'
                  where run_id=:'id'::bigint"
            echo "Closed run $RUN_ROW_ID as failed"
          fi

      - name: Check database size against the free-tier ceiling
        id: dbsize
        # Runs even when the ingest failed - a full database is a plausible CAUSE of
        # that failure - but not when we never got a working connection, since then
        # this step would only fail a second time and bury the real error.
        if: always() && steps.state.outcome == 'success'
        env:
          RA_DB: ${{ secrets.RA_DB }}
        run: |
          mb=$(psql "$RA_DB" -tAX -v ON_ERROR_STOP=1 \
            -c "select (pg_database_size(current_database())/1024/1024)::bigint")
          echo "mb=$mb" >> "$GITHUB_OUTPUT"
          echo "Database size: ${mb} MB of the 500 MB free-tier ceiling"
          echo "- **Database size**: ${mb} MB / 500 MB" >> "$GITHUB_STEP_SUMMARY"
          [ "$mb" -ge 350 ] && echo "::warning::Database is ${mb} MB, past the 350 MB alert threshold (500 MB ceiling)."
          exit 0

      # ONE message per run, always - success, skip, or failure.
      #
      # This replaced alert-on-failure-only, which could not distinguish three states
      # that all looked identical from Discord: ingested a day, correctly skipped, and
      # never executed at all. The third is the one that matters, because it is exactly
      # how 2026-08-07 was lost - nobody ran the ingest and nothing said so. An alert
      # that only fires on failure cannot report the absence of a run.
      #
      # Honest limit, accepted by Ashwin 2026-08-09: a heartbeat sent BY the job still
      # cannot report the job never starting (workflow disabled, Actions outage, or
      # GitHub's 60-day-inactivity disabling of scheduled workflows). Catching that
      # needs an external watchdog, which was deliberately not built.
      - name: Report the run to Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          SQL_FILE: ${{ steps.generate.outputs.sql_file }}
          OBSERVED_ON: ${{ steps.generate.outputs.observed_on }}
          ROWS: ${{ steps.verify.outputs.rows }}
          DB_MB: ${{ steps.dbsize.outputs.mb }}
          LAST_BUILT_AT: ${{ steps.state.outputs.last_built_at }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$DB_MB" ]; then
            size=" DB ${DB_MB} MB / 500 MB."
            [ "$DB_MB" -ge 350 ] && size="$size :warning: Past the 350 MB alert threshold."
          else
            size=" DB size unknown."
          fi

          if [ "$JOB_STATUS" != "success" ]; then
            # A day missed is a day lost - tcgcsv serves only its current build.
            msg=":x: **Price ingest FAILED.** Today's prices are unrecoverable if this is not fixed before the next tcgcsv rebuild (~20:00 UTC).${size} $RUN_URL"
          elif [ -z "$SQL_FILE" ]; then
            msg=":fast_forward: **Price ingest: nothing to do.** tcgcsv has not rebuilt since ${LAST_BUILT_AT:-the last run}, so there was no new data.${size}"
          else
            msg=":white_check_mark: **Price ingest OK.** ${ROWS} observations for ${OBSERVED_ON}.${size}"
          fi

          echo "$msg"
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL is not set, so no daily message was sent."
            exit 0
          fi
          # Never fail the job over the notifier - a successful ingest that could not be
          # announced is still a successful ingest, and flipping it to red would itself
          # be a false alarm.
          jq -nc --arg c "$msg" '{content:$c}' \
            | curl -sS -X POST -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK_URL" \
            || echo "::warning::Discord notification failed to send."
