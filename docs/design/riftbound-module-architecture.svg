<svg viewBox="0 0 940 720" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Riftbound seven-module final topology</title>
  <desc>RiftCore (M0, schema and kernel) is the root everyone imports. RiftNotes (M1) captures raw data to RiftEngine (M2), which reconstructs and forks: field to RiftLab (M3), player to RiftCoach (M4). RiftLab feeds models to RiftCoach. RiftCoach softly recommends puzzles to RiftIQ (M5) and, in future, cards to RiftRecall (M6). Users interact with the user-facing modules only.</desc>

  <rect x="0" y="0" width="940" height="720" fill="#FBFBF9"/>
  <defs>
    <marker id="h" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#534AB7"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#1D9E75"/></marker>
    <marker id="o" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#D85A30"/></marker>
    <marker id="s" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#D4537E"/></marker>
    <marker id="u" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#888780"/></marker>
  </defs>

  <text x="30" y="30" font-size="17" font-weight="700" fill="#2C2C2A">Riftbound suite — final topology (M0–M6)</text>
  <text x="30" y="48" font-size="11.5" fill="#5F5E5A">Back-end is headless. Products are user-facing. Imports point down to M0; data flows up.</text>

  <rect x="250" y="60" width="440" height="50" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="2.5"/>
  <text x="270" y="82" font-size="13" font-weight="700" fill="#26215C">M0 · RiftCore — schema + forward rules kernel</text>
  <text x="270" y="100" font-size="10" fill="#3C3489">The root. Everyone imports it. Kernel validates puzzles, powers reconstruction, grading, sim.</text>

  <rect x="290" y="124" width="360" height="44" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="2"/>
  <text x="310" y="145" font-size="13" font-weight="700" fill="#0F6E56">M1 · RiftNotes — capture (raw, tagged)</text>
  <text x="310" y="161" font-size="10" fill="#5F5E5A">Transcription only. Tagged raw captures to RiftEngine.</text>

  <rect x="270" y="182" width="400" height="48" rx="10" fill="#F1EFE8" stroke="#444441" stroke-width="2.5"/>
  <text x="290" y="203" font-size="13" font-weight="700" fill="#2C2C2A">M2 · RiftEngine — reconstruction (abduction)</text>
  <text x="290" y="220" font-size="10" fill="#5F5E5A">Inverse of the kernel. Stateless per-capture; preserves player/field tag. THE FORK.</text>

  <text x="700" y="86" font-size="9.5" fill="#7F77DD" font-style="italic">RiftCore imported by</text>
  <text x="700" y="98" font-size="9.5" fill="#7F77DD" font-style="italic">M1 to M6 (down-edges)</text>

  <path d="M470,110 L470,122" fill="none" stroke="#7F77DD" stroke-width="1.6" marker-end="url(#h)"/>
  <path d="M470,168 L470,180" fill="none" stroke="#534AB7" stroke-width="2" marker-end="url(#h)"/>

  <path d="M360,230 C360,258 250,266 250,296" fill="none" stroke="#1D9E75" stroke-width="2.2" marker-end="url(#g)"/>
  <text x="120" y="266" font-size="10" font-weight="600" fill="#1D9E75">FIELD data →</text>
  <path d="M560,230 C560,258 545,266 545,296" fill="none" stroke="#D85A30" stroke-width="2.2" marker-end="url(#o)"/>
  <text x="560" y="266" font-size="10" font-weight="600" fill="#D85A30">PLAYER data →</text>

  <rect x="40" y="298" width="320" height="118" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="2"/>
  <text x="58" y="320" font-size="13" font-weight="700" fill="#712B13">M3 · RiftLab — sim + analysis</text>
  <text x="58" y="339" font-size="10" fill="#5F5E5A">FIELD + community data + self-play sim.</text>
  <text x="58" y="354" font-size="10" fill="#5F5E5A">Decision model, metagame, KPI framework.</text>
  <text x="58" y="373" font-size="9.5" font-style="italic" fill="#D85A30">Headless. Never sees player data.</text>
  <text x="58" y="389" font-size="9.5" font-style="italic" fill="#D85A30">Presents through RiftCoach.</text>
  <text x="58" y="406" font-size="9.5" font-weight="600" fill="#712B13">Private premium sim = your engine.</text>

  <rect x="384" y="298" width="250" height="118" rx="10" fill="#FBEAF0" stroke="#D4537E" stroke-width="2"/>
  <text x="402" y="320" font-size="13" font-weight="700" fill="#72243E">M4 · RiftCoach</text>
  <text x="402" y="339" font-size="10" fill="#5F5E5A">PLAYER data + RiftLab models.</text>
  <text x="402" y="354" font-size="10" fill="#5F5E5A">Grading, tracking, recs,</text>
  <text x="402" y="369" font-size="10" fill="#5F5E5A">personal-strategy layer.</text>
  <text x="402" y="388" font-size="9.5" font-weight="600" fill="#72243E">User-facing. Public +</text>
  <text x="402" y="403" font-size="9.5" font-weight="600" fill="#72243E">private tier.</text>

  <rect x="658" y="298" width="120" height="118" rx="10" fill="#FBEAF0" stroke="#D4537E" stroke-width="2"/>
  <text x="676" y="320" font-size="13" font-weight="700" fill="#72243E">M5 · RiftIQ</text>
  <text x="676" y="339" font-size="10" fill="#5F5E5A">Puzzles.</text>
  <text x="676" y="354" font-size="10" fill="#5F5E5A">Imports</text>
  <text x="676" y="369" font-size="10" fill="#5F5E5A">kernel to</text>
  <text x="676" y="384" font-size="10" fill="#5F5E5A">validate.</text>
  <text x="676" y="402" font-size="9.5" font-weight="600" fill="#72243E">User-facing.</text>

  <rect x="800" y="298" width="120" height="118" rx="10" fill="#FBEAF0" stroke="#D4537E" stroke-width="2"/>
  <text x="818" y="320" font-size="13" font-weight="700" fill="#72243E">M6 · RiftRecall</text>
  <text x="818" y="339" font-size="10" fill="#5F5E5A">Flashcards.</text>
  <text x="818" y="354" font-size="10" fill="#5F5E5A">Imports</text>
  <text x="818" y="369" font-size="10" fill="#5F5E5A">RiftCore</text>
  <text x="818" y="384" font-size="10" fill="#5F5E5A">card data.</text>
  <text x="818" y="402" font-size="9.5" font-weight="600" fill="#72243E">User-facing.</text>

  <!-- lab -> coach -->
  <path d="M360,357 L380,357" fill="none" stroke="#534AB7" stroke-width="2" marker-end="url(#h)"/>
  <text x="120" y="440" font-size="9.5" font-weight="600" fill="#534AB7">RiftLab → RiftCoach: decision model, metagame, KPI framework</text>
  <!-- coach -> IQ soft -->
  <path d="M634,344 L654,344" fill="none" stroke="#D4537E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#s)"/>
  <!-- coach -> recall soft (future), routed over the top -->
  <path d="M540,298 C540,270 860,262 860,296" fill="none" stroke="#D4537E" stroke-width="1.8" stroke-dasharray="3 4" marker-end="url(#s)"/>
  <text x="600" y="458" font-size="9.5" font-weight="600" fill="#D4537E">soft: personalized puzzles → RiftIQ · (future) card picks → RiftRecall</text>

  <rect x="330" y="548" width="320" height="48" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1.8"/>
  <text x="452" y="578" font-size="15" font-weight="700" fill="#444441">USERS</text>
  <path d="M460,548 L440,418" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#u)"/>
  <path d="M560,548 C640,528 715,450 715,418" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#u)"/>
  <path d="M620,548 C760,524 858,450 858,418" fill="none" stroke="#888780" stroke-width="1.3" opacity="0.7" marker-end="url(#u)"/>
  <path d="M410,548 C300,524 470,190 500,170" fill="none" stroke="#888780" stroke-width="1.1" opacity="0.4" marker-end="url(#u)"/>
  <text x="345" y="616" font-size="9.5" fill="#888780">Users touch RiftNotes, RiftCoach, RiftIQ, RiftRecall — never the back-end.</text>

  <g font-size="10">
    <line x1="40" y1="628" x2="66" y2="628" stroke="#534AB7" stroke-width="2" marker-end="url(#h)"/>
    <text x="72" y="632" fill="#5F5E5A">Hard data edge (up)</text>
    <line x1="40" y1="648" x2="66" y2="648" stroke="#D4537E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#s)"/>
    <text x="72" y="652" fill="#5F5E5A">Soft feedback (forward; RiftRecall edge is future)</text>
    <line x1="40" y1="668" x2="66" y2="668" stroke="#888780" stroke-width="1.6" marker-end="url(#u)"/>
    <text x="72" y="672" fill="#5F5E5A">User interaction</text>
  </g>
</svg>
